[package]
name = "mosschat-net"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lints]
workspace = true

# TLS crypto provider: ring, not aws-lc-rs. rcgen (dev-dependency, example
# only) defaults to its own "ring" feature for certificate signing, so
# pinning quinn/rustls to the same backend keeps one crypto implementation
# in the binary instead of two, which is the spirit of invariant 9 even
# though ring/aws-lc-rs are not literally on deny.toml's crypto-major list.
[dependencies]
mosschat-core = { path = "../mosschat-core" }
quinn = { version = "0.11.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
# Direct dependency only so `path.rs` can name `quinn_proto::RttEstimator`,
# a type `quinn::congestion::Controller::on_ack` takes by reference but that
# `quinn` itself does not re-export. Pinned to the exact version `quinn`
# 0.11.11 itself resolves, so this never becomes a second copy in the tree.
quinn-proto = { version = "0.11.17", default-features = false }
# No "tls12" feature: QUIC is TLS 1.3 only (RFC 9001), so TLS 1.2 support is
# unreachable here (Konrad's review, should 8).
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "signal"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
blake3 = "1.8.7"
rand = "0.10"
thiserror = "2.0.20"
minicbor = { version = "2.3.0", features = ["std"] }
# WO-1.3a: real (not dev) dependency now. `AuthedConnection` (section 5)
# parses every peer certificate's SubjectPublicKeyInfo with a real DER
# parse rather than a fixed-byte-prefix search. Default features only: no
# `ring`/`aws-lc-rs` feature, so this pulls in no second crypto backend
# (invariant 9). MIT OR Apache-2.0, already on deny.toml's allow list.
x509-parser = { version = "0.18.1", default-features = false }
# WO-1.3a: real (not dev) dependency now. The gatehouse and the gate client
# both generate a self-signed certificate whose key is the ed25519 identity
# (section 5), the same construction the WO-1.2 spike used as a dev-only
# helper. rcgen's "ring" feature (its default) matches the crypto provider
# chosen above.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
# WO-1.3a: the sealed introduction body of section 1. `curve25519-dalek` is
# already ed25519-dalek 3.0.0's own point/scalar type (its Cargo.toml pins
# 5.0.0), so this names no new curve implementation, only the scalar
# multiplication `AuthorKey`'s ephemeral X25519 half needs against a peer's
# `VerifyingKey::to_montgomery()` output.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
# WO-1.4a, Konrad's review of PR #28: `time` was already in the tree
# transitively (x509-parser, rcgen), so a 150 line hand-rolled UTC calendar
# implementation duplicated a crate already compiled into the binary. Named
# directly now for `diag.rs`'s RFC 3339 timestamps; "parsing"/"formatting"
# are the two feature flags `time::OffsetDateTime::parse`/`::format` need
# for `time::format_description::well_known::Rfc3339`. MIT OR Apache-2.0,
# already on deny.toml's allow list.
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
# WO-1.4a, same review: replaces the hand-rolled recursive-descent JSON
# parser diag.rs shipped with in PR #28, which recursed once per nesting
# level with no depth cap (a deeply nested line could abort the process
# with a stack overflow instead of `read_records` reporting it as a
# malformed line). serde_json's `Value` deserializer caps recursion depth
# at 128 and returns an error past it. MIT OR Apache-2.0, already on
# deny.toml's allow list; `serde` itself was already in the tree
# transitively (rcgen, x509-parser) at the same 1.0.229.
serde_json = "1.0"

[dev-dependencies]
# `test-util`'s paused clock only, for `path::tests::a_full_house_queue_drains_at_the_house_rate`
# (issue #71): cargo unifies this with the `[dependencies]` entry above for
# this crate's own test and bench builds, so it never reaches a consumer of
# the library, only `cargo test`/`cargo bench` here.
tokio = { version = "1.53.1", features = ["test-util"] }

[[bench]]
name = "porch_socket"
harness = false
