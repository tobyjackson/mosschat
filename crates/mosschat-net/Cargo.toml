[package]
name = "mosschat-net"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lints]
workspace = true

# TLS crypto provider: ring, not aws-lc-rs. rcgen (dev-dependency, example
# only) defaults to its own "ring" feature for certificate signing, so
# pinning quinn/rustls to the same backend keeps one crypto implementation
# in the binary instead of two, which is the spirit of invariant 9 even
# though ring/aws-lc-rs are not literally on deny.toml's crypto-major list.
[dependencies]
mosschat-core = { path = "../mosschat-core" }
quinn = { version = "0.11.11", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
# No "tls12" feature: QUIC is TLS 1.3 only (RFC 9001), so TLS 1.2 support is
# unreachable here (Konrad's review, should 8).
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
blake3 = "1.8.7"
rand = "0.10"

[dev-dependencies]
# rcgen: dev-dependency only, used by the spike example to build a
# self-signed certificate whose key is the ed25519 identity. rcgen's
# "ring" feature (its default) matches the crypto provider chosen above.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
# x509-parser: replaces the spike's hand-rolled fixed-prefix SPKI byte
# search (Yseult's review, finding 5) with a real DER parse. Default
# features only: no `ring`/`aws-lc-rs` feature, so this pulls in no second
# crypto backend (invariant 9); it is used only to walk the DER structure
# and read the raw SubjectPublicKeyInfo bytes, never to verify a signature.
# MIT OR Apache-2.0, already on deny.toml's allow list.
x509-parser = { version = "0.18.1", default-features = false }
