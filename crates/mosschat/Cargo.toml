[package]
name = "mosschat"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lints]
workspace = true

[[bin]]
name = "mosschat"
path = "src/main.rs"

[dependencies]
mosschat-core = { path = "../mosschat-core" }
mosschat-net = { path = "../mosschat-net" }
mosschat-door = { path = "../mosschat-door" }
mosschat-tui = { path = "../mosschat-tui" }
# WO-1.3a: the `gatehouse` subcommand needs an async runtime to run
# `mosschat-net`'s gate server. Same version pinned there.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
rand = "0.10"

# WO-1.4b: `tests/doctor.rs` runs the built binary and parses the record it
# wrote back through `diag`'s own reader, which is the verification section
# 8 asks for. `mosschat-net` is already a normal dependency of this crate;
# an integration test links only the crate under test and its
# dev-dependencies, so it is named again here rather than added to the tree.
[dev-dependencies]
mosschat-net = { path = "../mosschat-net" }
