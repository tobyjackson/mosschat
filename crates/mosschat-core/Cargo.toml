[package]
name = "mosschat-core"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[lints]
workspace = true

# CBOR crate pick (D7, WO-1.2): minicbor. Reasoning and the three-way trial
# output are in docs/dev/cbor-pick.md. cbor4ii and ciborium (the other two D7
# candidates) also passed the trial and are deliberately not dependencies here.
[dependencies]
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
thiserror = "2.0.20"
blake3 = "1.8.7"
rand = "0.10"
minicbor = { version = "2.3.0", features = ["std"] }
# WO-1.3a fix 3 (Yseult finding 9): wraps the identity seed while it is held
# here, so a temporary owned copy is zeroized promptly rather than left for
# the allocator; already a transitive dependency of ed25519-dalek, so this
# adds no new version to the tree.
zeroize = "1.9"

# WO-2.5 (D6): the encrypted store. rusqlite's `bundled-sqlcipher-vendored-openssl`
# builds and statically links SQLCipher and OpenSSL from source, so the store needs
# no system crypto library on the machine it runs on or builds on. Reasoning,
# licences and the alternatives considered are in the store.rs module docs and
# `docs/dev/store-open-questions.md`.
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
# The passphrase path's memory-hard derivation (decision 10). RustCrypto, MIT OR
# Apache-2.0, both already allowed.
argon2 = "0.5.3"
# The single-instance guard (decision 23): an advisory lock on a lock file, taken
# before the SQLite connection is opened. Minimal-dependency, descriptor-based,
# cross-platform (flock on Unix, LockFileEx on Windows).
fd-lock = "4.0.4"

[dev-dependencies]
tempfile = "3.14"
