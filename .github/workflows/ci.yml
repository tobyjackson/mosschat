name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # dtolnay/rust-toolchain does not read rust-toolchain.toml itself; the @stable
      # rev and the components list below are kept in sync with that file by hand.
      # rustup also honours rust-toolchain.toml directly for any `cargo`/`rustc`
      # invocation in this checkout, so a drift here would still be caught locally.
      - name: Install Rust toolchain (kept in sync with rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run the checks
        run: ./ci/check.sh

  # Builds and publishes Linux release binaries so the NAT/fault-matrix
  # harness (crates/mosschat-net/tests/harness/) and anyone else who just
  # wants to run mosschat can `gh run download` a binary instead of
  # installing a Rust toolchain on every test box (Toby, 2026-09: "why
  # would build tools be needed on a machine that only runs the binary").
  #
  # Deliberately NOT on `pull_request` or every `push`: a PR branch's
  # binary is not what anyone downloads for real work, only main's is,
  # so this only rebuilds when main actually moves. `workflow_dispatch`
  # covers re-running it on demand (e.g. to regenerate an artifact whose
  # 14-day retention expired) without needing a throwaway commit.
  #
  # ubuntu-latest only: no macOS/Windows artifact yet, and no cross
  # build. ubuntu-latest's glibc is OLDER than what a fresh Ubuntu 26.04
  # box ships, which is what lets the resulting binary run there (a
  # newer glibc is backwards-compatible with binaries linked against an
  # older one, not the reverse) -- but that is a property this job gets
  # for free from the runner image, not a deliberately chosen baseline,
  # and nothing here pins a specific glibc version or checks it against
  # a floor. This job is the seed of WO-5.4 (real release engineering:
  # a pinned baseline glibc or a musl/static build, checksums published
  # as release assets, multiple targets), not a replacement for it --
  # no reproducibility is claimed for what this job produces.
  artifacts-linux:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Same toolchain-pin comment as the check job above: dtolnay/rust-toolchain
      # does not read rust-toolchain.toml itself; keep the @stable rev and
      # components list in sync with that file by hand. `targets:` adds the
      # musl target to this same toolchain for the static leg below, so
      # there is still only one toolchain-install step to keep in sync.
      - name: Install Rust toolchain (kept in sync with rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2

      - name: Build mosschat (release)
        run: nice -n 10 env CARGO_BUILD_JOBS=3 cargo build --release -p mosschat --bin mosschat

      - name: Build spike example (release)
        run: nice -n 10 env CARGO_BUILD_JOBS=3 cargo build --release -p mosschat-net --example spike

      - name: Stage artifact and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/mosschat dist/mosschat
          cp target/release/examples/spike dist/spike
          ( cd dist && sha256sum mosschat spike > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosschat-linux-x86_64-${{ steps.vars.outputs.sha_short }}
          path: |
            dist/mosschat
            dist/spike
            dist/SHA256SUMS
          retention-days: 14

      # Second, fully static leg: hewn-pc (Toby's Hewn test box) is
      # musl-only with no glibc at all, so the dynamic build above fails
      # there with "cannot execute: required file not found" (no
      # /lib64/ld-linux-x86-64.so.2 present to satisfy the interpreter).
      # musl-tools gives the `musl-gcc` wrapper the `cc`-crate build deps of
      # ring and blake3 need to cross-compile their C/asm for the musl
      # target (SQLite is not in this workspace's dependency tree today --
      # see crates/*/Cargo.toml -- so it needs no accommodation here yet).
      # Static linking itself is forced by .cargo/config.toml's
      # [target.x86_64-unknown-linux-musl] rustflags, not a RUSTFLAGS env
      # var here, so `cargo build --target x86_64-unknown-linux-musl` stays
      # reproducible identically outside CI.
      - name: Install musl-tools (musl-gcc, for ring/blake3's cc build deps)
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build mosschat (release, musl static)
        run: nice -n 10 env CARGO_BUILD_JOBS=3 cargo build --release --target x86_64-unknown-linux-musl -p mosschat --bin mosschat

      - name: Build spike example (release, musl static)
        run: nice -n 10 env CARGO_BUILD_JOBS=3 cargo build --release --target x86_64-unknown-linux-musl -p mosschat-net --example spike

      - name: Stage musl artifact and checksums
        run: |
          set -euo pipefail
          mkdir -p dist-musl
          cp target/x86_64-unknown-linux-musl/release/mosschat dist-musl/mosschat
          cp target/x86_64-unknown-linux-musl/release/examples/spike dist-musl/spike
          ( cd dist-musl && sha256sum mosschat spike > SHA256SUMS )
          cat dist-musl/SHA256SUMS

      # Fails the job outright rather than silently uploading a binary that
      # still needs a dynamic linker hewn-pc doesn't have. `--version` is a
      # real execution, not just a link check, and only succeeds at all
      # because the runner's kernel can exec a static musl binary that
      # carries no interpreter. Accepts either "statically linked" or
      # "static-pie linked": x86_64-unknown-linux-musl has defaulted to
      # static-pie since Rust 1.59, and both forms carry no dynamic
      # interpreter -- only the traditional non-PIE form segfaults less
      # predictably to force (rust-lang/rust#73661), which is why this
      # doesn't add -C relocation-model=static to chase the older wording.
      - name: Verify static linking and binary execution
        run: |
          set -euo pipefail
          file dist-musl/mosschat
          if ! file dist-musl/mosschat | grep -qE 'statically linked|static-pie linked'; then
            echo "verify: FAIL: dist-musl/mosschat is not statically linked" >&2
            exit 1
          fi
          dist-musl/mosschat --version

      - name: Upload musl artifact
        uses: actions/upload-artifact@v4
        with:
          name: mosschat-linux-x86_64-musl-${{ steps.vars.outputs.sha_short }}
          path: |
            dist-musl/mosschat
            dist-musl/spike
            dist-musl/SHA256SUMS
          retention-days: 14
